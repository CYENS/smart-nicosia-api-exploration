# The chat check's questions (tools/chat_check/chat_check.py). Per feature: a direct question, a
# where question that should draw on the map, an over-time question where the feature has
# history, the same at a past moment of the city clock, and a question that crosses two features;
# then failure cases and follow-ups that lean on the answer before.
#
# Fields: id, feature, ask (as a user would type it), and what the answer must do:
#   tools      every entry must be called; "a|b" is either
#   tools_not  must not be called
#   visual     must reach the page: layer, layer:<style>, chart, visual, card, card:<action>,
#              clock, inspect, view, scenario, fly_to, city_3d, none; "a|b" is either
#   say        regular expressions the answer must contain (case-insensitive); say_any: one of
#   not_say    regular expressions it must not contain
#   ids        true: names at least one id the page turns into a chip
#   no_chart   true: a sentence does; a chart is a warning
#   args       {tool = ["key"]}: inputs the tool must be given (needs CHATBOT_TRACE_RESULTS=1)
# Context: clock = "yesterday 21:00" (or {at, compare, range}), location = [lat, lon],
#   inspecting / subject = {id, kind, name}, follows = "<id>" (same conversation, after it).
#
# Places used: Eleftheria Square (35.1705, 33.3607) for "me" unless the question says otherwise.

# -- street lights, parking sensors, bins and air sensors ---------------------------------------

[[question]]
id = "lamps-now"
feature = "devices"
ask = "How many street lights are on right now, and how much power are they drawing?"
tools = ["city_overview|find_devices"]
say = ['\d']
no_chart = true

[[question]]
id = "lamps-offline-map"
feature = "devices"
ask = "Show me the street lights that are offline on the map."
tools = ["find_devices"]
visual = ["layer"]

[[question]]
id = "lamps-night-replay"
feature = "devices"
ask = "Replay the street lights through last night."
tools = ["get_history"]
visual = ["layer", "chart"]

[[question]]
id = "parking-near-me"
feature = "devices"
ask = "Is there free on-street parking near me?"
location = [35.1705, 33.3607]
tools = ["find_devices|find_parking"]
visual = ["layer"]
ids = true

[[question]]
id = "parking-usual"
feature = "devices"
ask = "How full does parking on Makariou get on weekday evenings compared with usual?"
tools = ["query_history"]
visual = ["chart"]

[[question]]
id = "bins-full-map"
feature = "devices"
ask = "Which bins are full right now? Put them on the map."
tools = ["find_devices"]
visual = ["layer"]
ids = true

[[question]]
id = "bins-most-often"
feature = "devices"
ask = "Which bins were full most often this week?"
tools = ["query_history"]
visual = ["chart"]
ids = true

[[question]]
id = "air-ok"
feature = "devices"
ask = "Is the air OK right now?"
tools = ["city_overview|find_devices|environment_surface|measured_stations|get_weather"]
no_chart = true

[[question]]
id = "air-today"
feature = "devices"
ask = "How has the noise at the city's air stations changed today?"
tools = ["get_history|query_history|get_entity"]
visual = ["chart"]

[[question]]
id = "lamps-at-moment"
