[project]
name = "smart-nicosia-collector"
version = "0.1.0"
description = "Nicosia digital twin: a data collector (DuckDB history) and a Claude-powered map chatbot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "duckdb>=1.5.6",
    "fastapi>=0.151.0",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
collector = "collector.cli:main"
chatbot = "chatbot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["collector", "chatbot", "smart_nicosia_api.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
