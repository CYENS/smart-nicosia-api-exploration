[project]
name = "smart-nicosia-collector"
version = "0.1.0"
description = "Collects Smart Nicosia city data into DuckDB to build history for the digital-twin chatbot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pytz>=2026.5",
    "tzdata>=2026.5",
]

[project.scripts]
collector = "collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["collector", "smart_nicosia_api.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
